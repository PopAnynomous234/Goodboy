<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Block Blast Puzzle</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #game-frame { width: 100%; height: 100vh; border: none; display: block; }
    </style>
</head>
<body>

    <iframe id="game-frame" allow="cross-origin-isolated" sandbox="allow-scripts allow-same-origin"></iframe>

    <script>
        // THE FOLDER WHERE YOUR FILES LIVE
        const BUILD_URL = "https://cdn.jsdelivr.net/gh/PopAnynomous234/bl/Build/";

        const gameContent = `
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <base href="${BUILD_URL}">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #unity-canvas { width: 100%; height: 100%; background: #000; }
        #loading { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: #26FF9A; font-family: monospace; font-size: 20px; 
        }
    </style>
</head>
<body>
    <div id="loading">LOADING ENGINE...</div>
    <canvas id="unity-canvas"></canvas>

    <script>
        // THE FIX PART 2: Every single path must be an absolute string
        const config = {
            dataUrl: "${BUILD_URL}BlockBlast1.1-8.data.unityweb",
            frameworkUrl: "${BUILD_URL}BlockBlast1.1-8.framework.js.unityweb",
            codeUrl: "${BUILD_URL}BlockBlast1.1-8.wasm.unityweb",
            streamingAssetsUrl: "${BUILD_URL}StreamingAssets", 
            companyName: "reun",
            productName: "Block Blast Puzzle",
            productVersion: "1.1",
        };

        const canvas = document.querySelector("#unity-canvas");
        const loading = document.querySelector("#loading");

        const script = document.createElement("script");
        script.src = "${BUILD_URL}BlockBlast1.1-8.loader.js";
        
        script.onload = () => {
            // THE FIX PART 3: If createUnityInstance still fails, it's a bug in Unity's loader 
            // specifically regarding the 'blob:' protocol.
            createUnityInstance(canvas, config, (progress) => {
                loading.innerText = "LOADING: " + Math.round(100 * progress) + "%";
            }).then(() => {
                loading.style.display = "none";
            }).catch((err) => {
                console.error(err);
                loading.innerText = "UNITY ERROR";
            });
        };

        document.body.appendChild(script);
    <\/script>
</body>
</html>`;

        window.onload = function() {
            setTimeout(() => {
                const blob = new Blob([gameContent], { type: 'text/html' });
                const blobUrl = URL.createObjectURL(blob);
                document.getElementById('game-frame').src = blobUrl;
            }, 200);
        };
    </script>
</body>
</html>
