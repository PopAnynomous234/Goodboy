<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quake III Arena - Portable</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/genizy/Quake3@master/Quake3.css">
    <style>
        body, html { background: #000; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #loading-text { color: #26ff9a; font-family: monospace; font-size: 24px; text-align: center; margin-top: 20%; letter-spacing: 3px; }
        #viewport-frame { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="loading-text">RESTORING PROFILE & CORE...</div>
    <div id="viewport-frame"></div>

    <script src="https://cdn.jsdelivr.net/gh/genizy/Quake3@master/alertCustom.js"></script>

    <script>
        const BASE_URL = "https://cdn.jsdelivr.net/gh/genizy/Quake3@master/";
        window.profileData = null;

        // 1. RESTORE MISSING PROFILE FUNCTIONS
        window.getProfileData = function() {
            return window.profileData || "";
        };

        window.clearProfileData = function() {
            window.profileData = null;
        };

        // 2. PANIC REDIRECT
        window.addEventListener("keydown", (e) => {
            if (e.key === "Escape") window.top.location.replace("https://classroom.google.com");
        });

        // 3. MERGE & LOAD ENGINE
        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];
                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        let mergedBlob = new Blob(buffers, { type: 'application/javascript' });
                        resolve(URL.createObjectURL(mergedBlob));
                        return;
                    }
                    fetch(BASE_URL + fileParts[index])
                        .then(res => res.arrayBuffer())
                        .then(data => {
                            buffers.push(data);
                            fetchPart(index + 1);
                        }).catch(reject);
                }
                fetchPart(0);
            });
        }

        function runQuake3() {
            mergeFiles(["Quake3.js.part1", "Quake3.js.part2", "Quake3.js.part3"]).then((url) => {
                document.querySelector("#loading-text").remove();
                
                var script = document.createElement("script");
                script.onload = function () {
                    window.ioq3.viewport = document.getElementById("viewport-frame");
                    window.ioq3.elementPointerLock = true;
                    
                    window.ioq3.locateFile = function(path) {
                        if (path.endsWith(".wasm")) return BASE_URL + "Quake3.wasm";
                        return path;
                    };

                    window.ioq3.callMain();
                };
                script.src = url;
                document.body.appendChild(script);
            });
        }

        window.addEventListener("load", runQuake3);

        // Handle viewport scaling
        window.addEventListener("resize", function () {
            try {
                if (window.ioq3 && window.ioq3.setCanvasSize) {
                    window.ioq3.setCanvasSize(window.innerWidth, window.innerHeight);
                }
            } catch (err) {}
        });
    </script>
</body>
</html>
