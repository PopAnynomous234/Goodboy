<?xml version="1.0" encoding="UTF-8" ?>
<Module>
<ModulePrefs title="Hands of War - UGS" />
<Content type="html"><![CDATA[
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hands of War</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="container"></div>

    <script src="https://cdn.jsdelivr.net/gh/u-cvlassrom-y/google@main/ruffle.js"></script>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("container");
            container.appendChild(player);
            
            // Configuration for the SWF
            player.load({
                url: "https://cdn.jsdelivr.net/gh/Stinkalistic/UGS@main/SWFs/handsofwar.swf",
                backgroundColor: "#000000",
                autoplay: "on",
                unmuteIt: true
            });

            // Ensure the player fills the screen
            player.style.width = "100%";
            player.style.height = "100%";
        });
    </script>
</body>
</html>
]]></Content>
</Module>
