<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Speed Stars</title>
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/speed-stars/TemplateData/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/speed-stars/TemplateData/style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background: #000;
        }
        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
    </div>

    <script>
        // Literal path definitions
        const CDN_ROOT = "https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/speed-stars/";
        const BUILD_ROOT = CDN_ROOT + "Build/";

        window.fileMergerConfig = {
            files: [
                { name: 'webgl.data', parts: 5 },
                { name: 'webgl.wasm', parts: 3 },
                { name: 'webgl.framework.js', parts: 1 },
            ],
            basePath: BUILD_ROOT,
            debug: true
        };
    </script>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/merge.js"></script>

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");

        function unityShowBanner(msg, type) {
            console.log("Unity Message:", msg);
        }

        // Use literal URLs for Unity Config
        var config = {
            dataUrl: BUILD_ROOT + "webgl.data",
            frameworkUrl: BUILD_ROOT + "webgl.framework.js",
            codeUrl: BUILD_ROOT + "webgl.wasm",
            streamingAssetsUrl: CDN_ROOT + "StreamingAssets",
            companyName: "Luke Doukakis",
            productName: "Speed Stars",
            productVersion: "1.0",
            showBanner: unityShowBanner,
        };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
        }

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            container.className = "unity-mobile";
            resizeCanvas();
            unityShowBanner('Mobile support may be limited.');
        } else {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        loadingBar.style.display = "block";

        // Load the loader script with an absolute URL
        var script = document.createElement("script");
        script.src = BUILD_ROOT + "webgl.loader.js";
        script.crossOrigin = "anonymous"; // Helps with CDN CORS issues in srcdoc
        
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
            }).catch((message) => {
                console.error("Unity Load Error:", message);
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
