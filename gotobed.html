<!DOCTYPE html>
<html lang="en-us">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<title>Go To Bed web port</title>
		<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no" />
		<style>
			html, body {
				margin: 0;
				padding: 0;
				overflow: hidden;
				height: 100%;
				width: 100%;
				background: #26251e;
			}
			canvas {
				display: block;
				position: fixed;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
			}
			#loading-overlay {
				position: fixed;
				top: 0; left: 0; width: 100%; height: 100%;
				background: #26251e;
				display: flex;
				justify-content: center;
				align-items: center;
				color: white;
				font-family: sans-serif;
				z-index: 10;
			}
		</style>
	</head>
	<body>
		<div id="loading-overlay">Merging assets... please wait.</div>
		<canvas id="unity-canvas" tabindex="-1"></canvas>

		<script src="https://cdn.jsdelivr.net/gh/shayderrr/portsv4@6352fa599299465a054122a28931228c59a31e89/go%20to%20bed/Build/GTBPort.loader.js" crossorigin="anonymous"></script>
		
		<script>
			// Hardcoded absolute URL for Build folder
			const BASE_URL = "https://cdn.jsdelivr.net/gh/shayderrr/portsv4@6352fa599299465a054122a28931228c59a31e89/go%20to%20bed/Build/";
            // Hardcoded absolute URL for StreamingAssets (Unity sometimes looks for this relatively)
            const STREAMING_URL = "https://cdn.jsdelivr.net/gh/shayderrr/portsv4@6352fa599299465a054122a28931228c59a31e89/go%20to%20bed/StreamingAssets";

			async function fetchAndMerge(fileParts) {
				const downloadPromises = fileParts.map(part => 
					fetch(BASE_URL + part).then(res => {
						if (!res.ok) throw new Error(`Failed to load ${part}`);
						return res.blob();
					})
				);
				const blobs = await Promise.all(downloadPromises);
				return URL.createObjectURL(new Blob(blobs));
			}

			async function initUnity() {
				try {
					const overlay = document.getElementById('loading-overlay');
					
					// Parts as defined in your build
					const dataParts = ["GTBPort.data.part1", "GTBPort.data.part2", "GTBPort.data.part3"];
					const wasmParts = ["GTBPort.wasm.part1", "GTBPort.wasm.part2"];

					console.log("Downloading and merging files via literal URLs...");
					
					// Merge files concurrently
					const [mergedDataUrl, mergedWasmUrl] = await Promise.all([
						fetchAndMerge(dataParts),
						fetchAndMerge(wasmParts)
					]);

					overlay.innerText = "Starting Unity Engine...";

					createUnityInstance(document.querySelector("#unity-canvas"), {
						dataUrl: mergedDataUrl,
						frameworkUrl: BASE_URL + "GTBPort.framework.js",
						codeUrl: mergedWasmUrl,
						streamingAssetsUrl: STREAMING_URL,
						companyName: "Joseph Mularczyk",
						productName: "Go To Bed",
						productVersion: "1.0",
					}).then((instance) => {
						overlay.style.display = "none";
					}).catch(err => {
                        console.error("Unity Instance Error:", err);
                        overlay.innerText = "Unity Start Failed. Check Console.";
                    });

				} catch (err) {
					console.error("Unity Loading Error:", err);
					document.getElementById('loading-overlay').innerText = "Error merging assets.";
				}
			}

			// Ensure createUnityInstance is available before running
            if (typeof createUnityInstance === 'undefined') {
                window.addEventListener('load', initUnity);
            } else {
                initUnity();
            }
		</script>
	</body>
</html>
