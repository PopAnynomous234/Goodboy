<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Top Speed Racing 3D | Sync</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #26ff9a; font-family: monospace; }
        #unity-container { width: 100%; height: 100%; position: fixed; top: 0; left: 0; background: #000; }
        #unity-canvas { width: 100%; height: 100%; }
        #boot-loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; z-index: 10;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(38, 255, 154, 0.2);
            border-radius: 50%; border-top-color: #26ff9a;
            animation: spin 1s linear infinite; margin: 10px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #progress-bar { width: 200px; height: 2px; background: #111; margin-top: 10px; border-radius: 2px; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: #26ff9a; transition: width 0.2s; }
    </style>
</head>
<body>
    <div id="boot-loader">
        <div class="spinner"></div>
        <div id="status">INJECTING RACE ASSETS...</div>
        <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
    </div>

    <script>
        const status = document.getElementById("status");
        const progressFill = document.getElementById("progress-fill");
        const base = "https://fastly.jsdelivr.net/gh/bubbls/UGS-Assets@main/top%20speed%20racing%203d/";
        
        async function mergeParts(prefix, count) {
            let buffers = [];
            for (let i = 1; i <= count; i++) {
                const partUrl = `${base}${prefix}.part${i}`;
                const resp = await fetch(partUrl);
                if (!resp.ok) throw new Error(`Part ${i} download failed`);
                buffers.push(await resp.arrayBuffer());
            }
            return new Blob(buffers);
        }

        async function initSync() {
            try {
                status.innerText = "MERGING DATA CORE...";
                
                // Fetch and merge the 3-part data file plus engine cores
                const [dataBlob, loaderText, frameworkBlob, wasmBlob] = await Promise.all([
                    mergeParts("Build/TopSpeedRacing_n1.data.unityweb", 3),
                    fetch(base + "Build/TopSpeedRacing_n1.loader.js").then(r => r.text()),
                    fetch(base + "Build/TopSpeedRacing_n1.framework.js.unityweb").then(r => r.blob()),
                    fetch(base + "Build/TopSpeedRacing_n1.wasm.unityweb").then(r => r.blob())
                ]);

                // Patching the loader to prevent path resolution errors in srcdoc
                const patchedLoader = loaderText.replace(
                    /new URL\((.*?),document.currentScript.src\)/g, 
                    `new URL($1, "${base}")`
                );

                const config = {
                    dataUrl: URL.createObjectURL(dataBlob),
                    frameworkUrl: URL.createObjectURL(frameworkBlob),
                    codeUrl: URL.createObjectURL(wasmBlob),
                    streamingAssetsUrl: base + "StreamingAssets",
                    companyName: "Top Speed Racing 3d 2",
                    productName: "Top Speed Racing 3d",
                    productVersion: "1.0",
                };

                const script = document.createElement("script");
                script.src = URL.createObjectURL(new Blob([patchedLoader], { type: 'application/javascript' }));
                script.onload = () => {
                    status.innerText = "IGNITING ENGINE...";
                    createUnityInstance(document.querySelector("#unity-canvas"), config, (progress) => {
                        progressFill.style.width = `${progress * 100}%`;
                        status.innerText = `SYNCING: ${Math.round(progress * 100)}%`;
                    }).then(() => {
                        document.getElementById("boot-loader").style.display = "none";
                    });
                };
                document.body.appendChild(script);

            } catch (e) {
                status.innerText = "CRITICAL ENGINE FAILURE";
                status.style.color = "#ff4d4d";
                console.error("Debug Log:", e);
            }
        }

        initSync();

        // Panic Key (\)
        window.addEventListener("keydown", (e) => {
            if (e.key === "\\") window.location.replace("https://study.thenametycoon.com");
        });
    </script>
</body>
</html>
