<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Asteroid Dodger</title>
<style>
:root{--bg:#070814;--fg:#dfe7ff;--accent:#26ff9a}
html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#02030a 0%, #071126 60%);color:var(--fg)}
#game{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{background:transparent;display:block}
.hud{position:fixed;left:12px;top:12px;color:var(--fg);font-weight:600;text-shadow:0 1px 0 #0008,0 2px 12px #0008}
.hud .line{margin:2px 0}
.instructions{position:fixed;right:12px;top:12px;text-align:right;opacity:.9}
.footer{position:fixed;left:12px;bottom:12px;opacity:.75;font-size:13px}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.overlay .panel{pointer-events:auto;background:linear-gradient(180deg,#111428dd,#0a0f1aaa);padding:20px;border-radius:14px;color:var(--fg);backdrop-filter: blur(6px);box-shadow:0 10px 40px #0008;border:1px solid rgba(255,255,255,0.03);min-width:280px}
.btn{display:inline-block;margin:8px 6px;padding:10px 14px;border-radius:10px;background:var(--accent);color:#111;font-weight:800;border:none;cursor:pointer}
.btn.secondary{background:#26ff9a;color:var(--fg);font-weight:700}
.small{font-size:13px;opacity:0.9}
</style>
</head>
<body>
<div id="game"><canvas id="c"></canvas></div>
<div class="hud">
  <div class="line">Time: <span id="time">0.00</span>s</div>
  <div class="line">Asteroids: <span id="count">0</span></div>
  <div class="line">Velocity: <span id="vel">0</span></div>
</div>
<div class="instructions">
  <div class="small">Controls:</div>
  <div style="font-weight:700">←/A rotate • →/D rotate • ↑/W thrust • Shift boost • M toggle debug</div>
</div>
<div class="footer">Choose difficulty and survive as long as you can.</div>

<!-- Start overlay: choose difficulty -->
<div class="overlay" id="startOverlay">
  <div class="panel" style="text-align:center">
    <div style="font-size:20px;font-weight:900">Asteroid Dodger</div>
    <div style="margin-top:8px;opacity:0.95">Select difficulty — game begins.</div>
    <div style="margin-top:14px">
      <button class="btn" data-diff="easy">Easy</button>
      <button class="btn" data-diff="medium">Medium</button>
      <button class="btn" data-diff="hard">Hard</button>
    </div>
    <div class="small" style="margin-top:12px;opacity:0.9">Tip: Use mouse to point rocket.</div>
  </div>
</div>

<!-- Death overlay -->
<div class="overlay" id="overlay" style="display:none">
  <div class="panel" id="endmsg" style="text-align:center">
    <div style="font-size:20px;font-weight:800">Ship Destroyed</div>
    <div style="margin-top:8px">Survived <span id="finalTime">0.00</span> seconds</div>
    <div style="margin-top:10px">
      <button class="btn secondary" id="restartBtn">Restart</button>
    </div>
  </div>
</div>

<script>
// ---------------- Vector Class ----------------
class V{constructor(x=0,y=0){this.x=x;this.y=y} add(v){this.x+=v.x;this.y+=v.y;return this} sub(v){this.x-=v.x;this.y-=v.y;return this} mul(s){this.x*=s;this.y*=s;return this} clone(){return new V(this.x,this.y)} len(){return Math.hypot(this.x,this.y)} norm(){const l=this.len()||1;this.x/=l;this.y/=l;return this} static sub(a,b){return new V(a.x-b.x,a.y-b.y)} }

// ---------------- Canvas Setup ----------------
const canvas=document.getElementById('c'); const ctx=canvas.getContext('2d'); let W=innerWidth,H=innerHeight; canvas.width=W;canvas.height=H;
window.addEventListener('resize',()=>{W=innerWidth;H=innerHeight;canvas.width=W;canvas.height=H});

// ---------------- Parameters ----------------
const BASE = {MAX_AST:12,SPAWN_INTERVAL:1.1,AST_SPEED:20,AST_SCALE:[30,120]};
let PARAMS = Object.assign({},BASE);

function applyDifficulty(d){
  if(d==='easy'){ PARAMS.MAX_AST=15; PARAMS.SPAWN_INTERVAL=1.5; PARAMS.AST_SPEED=14; PARAMS.AST_SCALE=[25,90]; }
  if(d==='medium'){ PARAMS.MAX_AST=23; PARAMS.SPAWN_INTERVAL=1.1; PARAMS.AST_SPEED=20; PARAMS.AST_SCALE=[30,120]; }
  if(d==='hard'){ PARAMS.MAX_AST=30; PARAMS.SPAWN_INTERVAL=0.75; PARAMS.AST_SPEED=20; PARAMS.AST_SCALE=[25,160]; }
}

// ---------------- Rocket & Asteroids ----------------
const FRICTION=0.999, ROT_SPEED=4.5, THRUST=220, BOOST_MULT=2.2;
function makeAsteroid(radius){ const pts=[]; const count = Math.floor(7 + Math.random()*6); for(let i=0;i<count;i++){ const ang=(i/count)*(Math.PI*2)+(Math.random()-0.5)*(Math.PI/count)*0.8; const r=radius*(0.6+Math.random()*0.8); pts.push({x:Math.cos(ang)*r,y:Math.sin(ang)*r}); } return pts; }

class Asteroid{ constructor(pos,vel,ang,angVel,radius){this.pos=pos;this.vel=vel;this.angle=ang;this.angVel=angVel;this.radius=radius;this.shape=makeAsteroid(radius);this.mass=radius*0.6} update(dt){this.pos.add(this.vel.clone().mul(dt));this.angle+=this.angVel*dt;this.wrap()} wrap(){if(this.pos.x<-this.radius) this.pos.x=W+this.radius; if(this.pos.x>W+this.radius) this.pos.x=-this.radius; if(this.pos.y<-this.radius) this.pos.y=H+this.radius; if(this.pos.y>H+this.radius) this.pos.y=-this.radius;} draw(ctx){ctx.save();ctx.translate(this.pos.x,this.pos.y);ctx.rotate(this.angle);ctx.beginPath();ctx.moveTo(this.shape[0].x,this.shape[0].y);for(let p of this.shape) ctx.lineTo(p.x,p.y);ctx.closePath();ctx.strokeStyle='rgba(200,200,220,0.9)';ctx.lineWidth=Math.max(1,this.radius*0.04);ctx.fillStyle='rgba(40,44,56,0.6)';ctx.fill();ctx.stroke();ctx.restore();} }

class Rocket{ constructor(){this.pos=new V(W/2,H/2);this.vel=new V(0,0);this.angle=-Math.PI/2;this.radius=18;this.thrusting=false;this.boost=false;this.alive=true} update(dt,inputs){if(!this.alive) return; this.angle += (inputs.left? -ROT_SPEED:0)*dt; this.angle += (inputs.right? ROT_SPEED:0)*dt; let accel=new V(0,0); if(inputs.up){const mag=THRUST*(inputs.boost?BOOST_MULT:1); accel.x=Math.cos(this.angle)*mag; accel.y=Math.sin(this.angle)*mag; this.thrusting=true;} else this.thrusting=false; this.vel.add(accel.clone().mul(dt)); this.vel.mul(FRICTION); this.pos.add(this.vel.clone().mul(dt)); if(this.pos.x< -this.radius) this.pos.x = W + this.radius; if(this.pos.x> W + this.radius) this.pos.x = -this.radius; if(this.pos.y< -this.radius) this.pos.y = H + this.radius; if(this.pos.y> H + this.radius) this.pos.y = -this.radius; } draw(ctx){ctx.save();ctx.translate(this.pos.x,this.pos.y);ctx.rotate(this.angle); ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(-12,10); ctx.lineTo(-8,0); ctx.lineTo(-12,-10); ctx.closePath(); ctx.fillStyle='#cfe8ff'; ctx.fill(); ctx.strokeStyle='rgba(20,26,35,0.9)'; ctx.lineWidth=1.5; ctx.stroke(); ctx.beginPath(); ctx.ellipse(-2,-1,6,4,0,0,Math.PI*2); ctx.fillStyle='#08213b88'; ctx.fill(); ctx.stroke(); if(this.thrusting){ const p=Math.random()*6+8; ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(-18-p,6); ctx.lineTo(-18-p,-6); ctx.closePath(); const g=ctx.createLinearGradient(-18,0,-6,0); g.addColorStop(0,'#ffdb6b'); g.addColorStop(0.5,'#ff8c42'); g.addColorStop(1,'#ff4b2b'); ctx.fillStyle=g; ctx.fill(); ctx.globalAlpha=0.6; ctx.fill(); ctx.globalAlpha=1; } ctx.restore(); } }

class Particles{ constructor(){this.list=[]} spawn(p,v,life,col){this.list.push({p:p.clone(),v:v.clone(),life,age:0,col})} update(dt){for(let i=this.list.length-1;i>=0;i--){const r=this.list[i];r.age+=dt; if(r.age>r.life){this.list.splice(i,1);continue;} r.p.add(r.v.clone().mul(dt)); r.v.mul(0.99);} } draw(ctx){for(const r of this.list){ctx.globalAlpha = 1 - (r.age/r.life); ctx.fillStyle=r.col; ctx.beginPath(); ctx.arc(r.p.x,r.p.y,Math.max(1,3*(1 - r.age/r.life)),0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1 } }

function collideRocketAst(r,a){const dx=r.pos.x-a.pos.x, dy=r.pos.y-a.pos.y; const d2=dx*dx+dy*dy; const rad=r.radius + a.radius; return d2 <= rad*rad; }

// ---------------- Game State ----------------
let asteroids=[], lastSpawn=0, time=0, inputs={left:false,right:false,up:false,boost:false};
const rocket=new Rocket(); const particles=new Particles(); let debug=false; let last=performance.now(); let gameOver=false;

// ---------------- Spawn Asteroid ----------------
function spawnAsteroid(){ const side=Math.random(); let pos; if(Math.random()<0.5){ const s=Math.random()*4|0; if(s===0) pos=new V(-50, Math.random()*H); if(s===1) pos=new V(W+50, Math.random()*H); if(s===2) pos=new V(Math.random()*W, -50); if(s===3) pos=new V(Math.random()*W, H+50); } else pos=new V(Math.random()*W, Math.random()*H); const toCenter=V.sub(new V(W/2,H/2), pos).norm(); const speed = PARAMS.AST_SPEED*(0.6 + Math.random()*1.4)*(Math.random()<0.4?1.6:1); const vel=new V(toCenter.x*speed + (Math.random()-0.5)*30, toCenter.y*speed + (Math.random()-0.5)*30); const ang=Math.random()*Math.PI*2; const angVel=(Math.random()-0.5)*1.5; const radius = PARAMS.AST_SCALE[0] + Math.random()*(PARAMS.AST_SCALE[1]-PARAMS.AST_SCALE[0]); const a=new Asteroid(pos,vel,ang,angVel,radius); asteroids.push(a); }

// ---------------- Input ----------------
window.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') inputs.left=true; if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') inputs.right=true; if(e.key==='ArrowUp'||e.key==='w'||e.key==='W') inputs.up=true; if(e.key==='Shift') inputs.boost=true; if(e.key==='m'||e.key==='M') debug=!debug; });
window.addEventListener('keyup',e=>{ if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') inputs.left=false; if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') inputs.right=false; if(e.key==='ArrowUp'||e.key==='w'||e.key==='W') inputs.up=false; if(e.key==='Shift') inputs.boost=false; });
canvas.addEventListener('mousemove',e=>{const rect=canvas.getBoundingClientRect(); const mx=e.clientX-rect.left, my=e.clientY-rect.top; rocket.angle = Math.atan2(my-rocket.pos.y, mx-rocket.pos.x); });
canvas.addEventListener('touchstart',e=>{e.preventDefault(); const t=e.touches[0]; const rect=canvas.getBoundingClientRect(); const mx=t.clientX-rect.left,my=t.clientY-rect.top; rocket.angle=Math.atan2(my-rocket.pos.y,mx-rocket.pos.x); inputs.up=true;}); 
canvas.addEventListener('touchend',e=>{inputs.up=false}); 
window.addEventListener('contextmenu',e=>e.preventDefault());

// ---------------- Step ----------------
function step(now){ 
    const dt=Math.min(0.033,(now-last)/1000); last=now; 
    if(rocket.alive) time+=dt; 
    lastSpawn+=dt; 
    if(lastSpawn > PARAMS.SPAWN_INTERVAL && asteroids.length < PARAMS.MAX_AST){ spawnAsteroid(); lastSpawn=0; }
    for(let a of asteroids) a.update(dt); 
    rocket.update(dt,inputs); 
    if(rocket.thrusting){ 
        const dir=new V(Math.cos(rocket.angle+Math.PI), Math.sin(rocket.angle+Math.PI)); 
        for(let i=0;i<3;i++){ 
            const ppos=rocket.pos.clone().add(new V((Math.random()-0.5)*6, (Math.random()-0.5)*6)); 
            const pv=dir.clone().mul(60 + Math.random()*100).add(new V((Math.random()-0.5)*30,(Math.random()-0.5)*30)); 
            particles.spawn(ppos,pv,0.6,'rgba(255,150,80,0.9)'); 
        } 
    }
    particles.update(dt); 
    if(rocket.alive){ 
        for(let i=0;i<asteroids.length;i++){ 
            if(collideRocketAst(rocket, asteroids[i])){ 
                explode(rocket, asteroids[i]); 
                rocket.alive=false; 
                gameOver=false; // reset before death loop
                break; 
            } 
        } 
    }
    ctx.clearRect(0,0,W,H); drawStarfield(ctx); for(let a of asteroids) a.draw(ctx); particles.draw(ctx); rocket.draw(ctx); 
    document.getElementById('time').textContent = time.toFixed(2); 
    document.getElementById('count').textContent = asteroids.length; 
    document.getElementById('vel').textContent = rocket.vel.len().toFixed(1);
    if(rocket.alive) requestAnimationFrame(step); else requestAnimationFrame(finalLoop);
}

// ---------------- Final Loop ----------------
function finalLoop(now){
    if(gameOver) return;
    const dt=Math.min(0.033,(now-last)/1000); last=now;
    for(let a of asteroids){ a.vel.mul(0.995); a.update(dt*0.4); }
    particles.update(dt*0.8);
    ctx.clearRect(0,0,W,H);
    drawStarfield(ctx);
    for(let a of asteroids) a.draw(ctx);
    particles.draw(ctx);
    drawWreck(ctx);
    document.getElementById('finalTime').textContent = time.toFixed(2);
    document.getElementById('overlay').style.display='flex';
    requestAnimationFrame(finalLoop);
}

// ---------------- Explode ----------------
function explode(rocket, asteroid){ 
    for(let i=0;i<60;i++){ const ang=Math.random()*Math.PI*2; const sp=60+Math.random()*240; const v=new V(Math.cos(ang)*sp,Math.sin(ang)*sp); particles.spawn(rocket.pos.clone().add(new V(Math.random()*6-3,Math.random()*6-3)),v,1+Math.random()*1.2,'rgba(255,200,80,0.95)'); } 
    for(let i=0;i<Math.min(40,Math.floor(asteroid.radius/3));i++){ const ang=Math.random()*Math.PI*2; const sp=20+Math.random()*120; const v=new V(Math.cos(ang)*sp,Math.sin(ang)*sp).add(asteroid.vel); particles.spawn(asteroid.pos.clone(),v,1.6,'rgba(200,200,220,0.9)'); } 
}

// ---------------- Starfield ----------------
const stars = Array.from({length:120},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*1.4}));
function drawStarfield(ctx){ctx.save();for(const s of stars){ctx.globalAlpha = 0.6*(0.5+s.z*0.5); ctx.fillStyle = s.z>1? '#dfe8ff':'#6fa3ff'; ctx.beginPath(); ctx.arc(s.x,s.y,1.2 + s.z, 0,Math.PI*2); ctx.fill();} ctx.restore();}
function drawWreck(ctx){ ctx.save(); for(let i=0;i<10;i++){ ctx.beginPath(); const px = rocket.pos.x + (Math.random()-0.5)*80; const py = rocket.pos.y + (Math.random()-0.5)*80; ctx.rect(px,py,Math.random()*8+2,Math.random()*2+1); ctx.fillStyle='rgba(220,220,230,0.95)'; ctx.fill(); } ctx.restore(); }

// ---------------- Start Overlay ----------------
const startOverlay=document.getElementById('startOverlay');
startOverlay.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    const d=b.getAttribute('data-diff'); 
    applyDifficulty(d); 
    startOverlay.style.display='none';
    for(let i=0;i< (PARAMS.MAX_AST/2|0); i++) spawnAsteroid(); 
    last=performance.now(); 
    gameOver=false; 
    requestAnimationFrame(step); 
}));

// ---------------- Restart Button ----------------
document.getElementById('restartBtn').addEventListener('click',()=>{
    gameOver = true;
    // Reset everything
    asteroids=[]; 
    time=0; 
    inputs={left:false,right:false,up:false,boost:false}; 
    rocket.pos = new V(W/2,H/2); 
    rocket.vel = new V(0,0); 
    rocket.angle = -Math.PI/2; 
    rocket.alive = true; 
    particles.list=[]; 
    lastSpawn=0;
    // Hide death overlay
    document.getElementById('overlay').style.display='none';
    // Show start overlay
    startOverlay.style.display='flex';
});
</script>
</body>
</html>
