<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Flappy Bird - Ruffle Bypass</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/AndreajnRcm4/b398dl2h74v@9a23fbb2373d743a564873251cbb57736ebc1f73/style.css" type="text/css" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #ruffle-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #boot-btn { 
            padding: 15px 30px; border: 2px solid #26ff9a; background: transparent; 
            color: #26ff9a; font-family: monospace; cursor: pointer; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="ruffle-container">
        <button id="boot-btn" onclick="initFlash()">START Game</button>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/u-cvlassrom-y/google@main/ruffle.js"></script>

    <script>
        // 1. PANIC REDIRECT
        window.addEventListener("keydown", (e) => {
            if (e.key === "Escape") window.top.location.replace("https://classroom.google.com");
        });

        // 2. ENVIRONMENT SHIELD
        // Stops Ruffle from crashing if it tries to talk to the school's wrapper
        window.postMessage = function() { return; };
        window.ytgame = { system: { isMuted: () => false }, engaged: { isEngaged: () => true } };

        async function initFlash() {
            const container = document.getElementById("ruffle-container");
            const btn = document.getElementById("boot-btn");
            btn.innerText = "LOADING_RUFFLE...";

            // 3. RUFFLE PLAYER CONFIGURATION
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            
            container.innerHTML = ""; // Clear button
            container.appendChild(player);

            player.style.width = "100%";
            player.style.height = "100%";

            // 4. LITERAL SWF LOADING
            player.load({
                url: "https://cdn.jsdelivr.net/gh/Stinkalistic/UGS@main/SWFs/flappybird.swf",
                allowScriptAccess: true,
                quality: "high",
                letterbox: "on"
            }).then(() => {
                console.log("Flash loaded successfully");
            }).catch((e) => {
                container.innerHTML = `<div style="color:#26ff9a">LOAD_ERROR: ${e.message}</div>`;
            });
        }
    </script>
</body>
</html>
