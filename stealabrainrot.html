<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Frame iFrame</title>
    <style>
        /* Ensures the html and body elements take up the full screen height and width */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0; /* Removes default browser margins */
            padding: 0; /* Removes default browser padding */
            overflow: hidden; /* Prevents body scrollbars due to iframe margins */
        }

        /* Styles the iframe to fill the entire viewport */
        iframe {
            height: 100%;
            width: 100%;
            border: none; /* Removes the default iframe border */
            display: block; /* Ensures the iframe behaves as a block element */
        }
    </style>
</head>
<body>
    <iframe src="https://codelistener-99672247-61ed5.firebaseapp.com/games/stealabrainrot.html" title="Full Frame Content"></iframe>
</body>
</html>
