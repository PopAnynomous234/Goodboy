<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>Unity WebGL Player | Granny 2</title>
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/forms-docs-slides-glgl/ngng@main/TemplateData/favicon.ico"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bubbls/ruffle@895d0224580381ddd003fc2ab72afead3cf134ad/john.css"/>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #unity-container { position: absolute; width: 100%; height: 100%; left: 0; top: 0; }
        #unity-canvas { width: 100%; height: 100%; background: #231f20; }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
    </div>

    <script>
        /** 1. GLOBALS & MOCK SDK **/
        // Define this globally so the Unity Framework can find it
        var myGameInstance = null; 

        window.YaGames = {
            init: function() {
                return Promise.resolve({
                    getPlayer: function() {
                        return Promise.resolve({
                            getName: () => "Player",
                            getPhoto: () => "",
                            getStats: () => Promise.resolve({}),
                            getData: () => Promise.resolve({})
                        });
                    },
                    adv: { showFullscreenAdv: (o) => { if(o.callbacks) o.callbacks.onClose(true); } },
                    // Fakes the environment check the game is failing on
                    environment: {
                        get i18n() { return { lang: 'en', tld: 'com' }; },
                        get device() { return { type: 'desktop' }; }
                    }
                });
            }
        };

        // Initialize mock
        YaGames.init().then(ysdk => { window.ysdk = ysdk; });
    </script>

    <script>
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");

        const BUILD_ROOT = "https://cdn.jsdelivr.net/gh/forms-docs-slides-glgl/ngng@main/Build";

        async function mergeFiles(parts, onProgress) {
            let loaded = 0;
            const total = parts.length;
            const blobs = await Promise.all(parts.map(async (part) => {
                const res = await fetch(part);
                const blob = await res.blob();
                loaded++;
                if (onProgress) onProgress(loaded / total);
                return blob;
            }));
            return URL.createObjectURL(new Blob(blobs));
        }

        async function initializeGame() {
            var dataParts = [
                BUILD_ROOT + "/Granny 2_part1.data",
                BUILD_ROOT + "/Granny 2_part2.data",
                BUILD_ROOT + "/Granny 2_part3.data"
            ];
            var wasmParts = [
                BUILD_ROOT + "/Granny 2_part1.wasm",
                BUILD_ROOT + "/Granny 2_part2.wasm"
            ];

            loadingBar.style.display = "block";

            try {
                var dataUrl = await mergeFiles(dataParts, p => progressBarFull.style.width = (40 * p) + "%");
                var wasmUrl = await mergeFiles(wasmParts, p => progressBarFull.style.width = (40 + 40 * p) + "%");

                var config = {
                    dataUrl: dataUrl,
                    frameworkUrl: BUILD_ROOT + "/Granny 2.frameworkx.js",
                    codeUrl: wasmUrl,
                    streamingAssetsUrl: "https://cdn.jsdelivr.net/gh/forms-docs-slides-glgl/ngng@main/StreamingAssets",
                    companyName: "Awesome",
                    productName: "Granny 2",
                    productVersion: "1.0",
                };

                var script = document.createElement("script");
                script.src = BUILD_ROOT + "/Granny 2.loader.js";
                script.onload = () => {
                    createUnityInstance(canvas, config, (progress) => {
                        progressBarFull.style.width = (80 + 20 * progress) + "%";
                    }).then((unityInstance) => {
                        // CRITICAL: Assigning the instance to the global variable
                        myGameInstance = unityInstance;
                        setTimeout(() => { loadingBar.style.display = "none"; }, 500);
                    }).catch((message) => {
                        console.error("Unity Error:", message);
                    });
                };
                document.body.appendChild(script);

            } catch (e) {
                console.error("Initialization Failed:", e);
            }
        }

        initializeGame();
    </script>
</body>
</html>
